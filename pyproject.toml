[project]
name = "acpcg"
description = "PyChunkedGraph processing for axonal connectomics skeleton and voxel segmentation data"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
  {name = "Russel Torres"}
]
maintainers = [
  {name = "Russel Torres"}
]
requires-python = ">3.8,<3.12"
dynamic = ["version"] 
dependencies = [
    "connected-components-3d",
    "navis",
    "tensorstore",
    "kimimaro",
    "rtree",
    "protobuf==4.24.3",
    "zstandard",
    "cloud-files",
    "cloud-volume",
    "crackle-codec",
    "imageio",
    "tifffile"
]

[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "ac_pcg",
]

# [tool.uv]
# prerelease="allow"

# some downgrades from pixi's expectations
[tool.pixi.system-requirements]
linux = "5.0.0"
libc = "2.27"

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
# pychunkedgraph = { git = "https://github.com/CAVEconnectome/PyChunkedGraph.git"}
# acpreprocessing = { path = ".", editable = true }

# conda-enabled features
[tool.pixi.feature.pixi-base.dependencies]
numpy = "*"
tensorstore = "*"
rtree = "*"
# protobuf = "*"
zstandard = "*"

# version-specific python features
[tool.pixi.feature.py310.dependencies]
python = "3.10.*"
[tool.pixi.feature.py311.dependencies]
python = "3.11.*"


[tool.pixi.feature.conda-lab.dependencies]
greenlet = "*"
jupyterlab = "*"

# [tool.pixi.feature.scalene.dependencies]
# scalene = "*"

[tool.pixi.environments]
py310 = ["py310"]
py311 = ["py311"]
py310-conda = ["py310", "pixi-base"]
py311-conda = ["py311", "pixi-base"]
py311-conda-lab = ["py311", "pixi-base", "conda-lab"]


[tool.pixi.feature.conda-lab.tasks]
jlab = "jupyter lab"
